---
workspace: /root

php_xdebug_version: 3.1.2
php_xdebug_cli_disable: false # Only used on Debian/Ubuntu.

# Configuration for Xdebug 3
php_xdebug_mode: debug
php_xdebug_start_with_request: 'no'
php_xdebug_discover_client_host: 'false'
php_xdebug_client_host: localhost
# php_xdebug_log: /tmp/xdebug.log
# php_xdebug_log_level: 7

# Configuration for Xdebug 2
php_xdebug_coverage_enable: 1
php_xdebug_default_enable: 1
php_xdebug_remote_enable: 'false'
php_xdebug_remote_connect_back: 'false'
php_xdebug_remote_host: localhost
php_xdebug_remote_port: "9000"
php_xdebug_remote_log: /tmp/xdebug.log
php_xdebug_remote_autostart: 'false'

# Configuration for Xdebug 2 and 3
php_xdebug_idekey: sublime.xdebug
php_xdebug_max_nesting_level: 256